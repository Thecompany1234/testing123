<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Send Text to Google Sheet</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    input[type="text"] {
      padding: 8px;
      width: 250px;
      font-size: 14px;
    }
    button {
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Send Text to Spreadsheet</h2>
  
  <input type="text" id="userInput" placeholder="Type something here..." />
  <button onclick="sendData()">Send</button>

  <p id="status"></p>

  <script>
    // Replace with your Web App URL from Step 2
    const SCRIPT_URL = 'https://script.google.com/a/macros/acsd1.org/s/AKfycbxnYSV_CsTsPHiJJ5pN51J1IVI_Rf7QrNvjCkzabKkO5LTdcKx4iWlAr09d-vNL2B9HgA/exec';

    function sendData() {
      const input = document.getElementById('userInput');
      const status = document.getElementById('status');
      const text = input.value.trim();

      if (!text) {
        status.textContent = 'Please enter some text first.';
        return;
      }

      status.textContent = 'Sending...';

      // Use URLSearchParams to send data as a POST request
      const formData = new URLSearchParams();
      formData.append('text', text);

      fetch(SCRIPT_URL, {
        method: 'POST',
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          status.textContent = 'Successfully sent!';
          input.value = ''; // Clear input field
        } else {
          status.textContent = 'Error: ' + data.message;
        }
      })
      .catch(error => {
        status.textContent = 'Error sending data.';
        console.error(error);
      });
    }
  </script>

</body>
</html>
